[package]
name = "catremote-core"
version = "0.1.0"
edition = "2021"
description = "CatRemote capture, encode, input-injection and transmission core engine"

[lib]
name = "catremote_core"
path = "src/lib.rs"

[[bin]]
name = "catremote-core"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
thiserror = "2.0.3"
async-trait = "0.1.83"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.8"
zbus = "4"
