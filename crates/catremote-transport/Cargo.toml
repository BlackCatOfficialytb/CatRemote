[package]
name = "catremote-transport"
version = "0.1.0"
edition = "2021"

[dependencies]
catremote-capture = { path = "../catremote-capture" }
catremote-audio-input = { path = "../catremote-audio-input", default-features = false }
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
parking_lot = "0.12"
rand = "0.8"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
quinn = { version = "0.10", default-features = false, features = ["rustls", "runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["tls12", "std", "aws-lc-rs"] }
rustls-pemfile = "1.0"
x509-parser = "0.16"
pem = "3.0"

[features]
default = []