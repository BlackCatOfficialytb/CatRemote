[package]
name = "catremote-capture"
version = "0.1.0"
edition = "2021"

[dependencies]
catremote-env = { path = "../catremote-env" }
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
parking_lot = "0.12"
async-trait = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31", features = ["log"] }
wayland-protocols = "0.31"
pipewire = "0.1"
libva = "0.1"
drm = "0.2"
nix = "0.28"
libc = "0.2"
ash = { version = "0.37", features = ["libloading"] }  # For Vulkan/VAAPI interop