[package]
name = "catremote-env"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31", features = ["log"] }
wayland-protocols = "0.31"
pipewire = "0.1"
libva = "0.1"
nvml-wrapper = "0.7"
drm = "0.2"
zbus = { version = "4.2", features = ["tokio"] }
zvariant = "5.0"
nix = "0.28"

[dev-dependencies]
tempfile = "3.9"